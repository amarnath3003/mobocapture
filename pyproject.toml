[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mobocapture"
version = "0.1.0.dev0"
description = "Evidence-linked RGB video processing for robot-learning datasets"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "MoboCapture contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "mediapipe==0.10.35",
  "huggingface-hub>=0.36,<1",
  "numpy>=2.0,<3",
  "Pillow>=10,<13",
  "pyarrow>=18,<25",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
  "safetensors>=0.5,<1",
  "timm>=1.0,<2",
  "torch>=2.6,<3",
  "torchvision>=0.21,<1",
  "transformers==4.57.2",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<9"]

[project.scripts]
mobocapture = "mobocapture.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mobocapture = ["static/*", "static/assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
